name: Windows x64 build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Portable unit tests
        run: cargo test --locked -- --skip room::network_tests
      - name: LAN integration tests (explicitly skipped in CI)
        run: |
          Write-Output 'SKIPPED: room::network_tests requires real sockets, discovery and timing; LAN tests are not stable CI acceptance tests. Run cargo test --locked room::network_tests -- --test-threads=1 on a suitable local network.'
      - name: Build Windows x64 release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package executable and checksums
        run: ./scripts/package-windows.ps1
      - name: Upload Windows x64 ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: 300-Questions-windows-x64
          path: |
            dist/300-Questions-windows-x64.zip
            dist/300-Questions-windows-x64.zip.sha256
          if-no-files-found: error
